name: oidc
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" > /tmp/tok.json
          python3 -c "import json;print(json.load(open('/tmp/tok.json'))['value'])" | fold -w120
