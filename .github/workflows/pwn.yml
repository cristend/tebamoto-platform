name: pwn
on: [pull_request]
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: env | sort | sed 's/=\(.\{4\}\).*/=\1.../' | grep -viE "path|home|lang|shell|term|user_|shlvl|pwd|oldpwd|hostname|_=/|workdir|temp|agent|runner|image|os|xdg|deb|pipeline|stats"
